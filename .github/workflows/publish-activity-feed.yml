name: Validate and publish lottery activity

on:
  schedule:
    # Recheck refreshable official sources every six hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tooling/**'
      - 'test/tooling/**'
      - '.github/workflows/publish-activity-feed.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lottery-atlas-activity-publish
  cancel-in-progress: false

jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued events can reference a commit from before the preceding
          # feed run pushed its generated files. Import from today's branch tip.
          ref: main
      - uses: dart-lang/setup-dart@v1
      - name: Test bounded source HTTP requests
        run: dart test/tooling/source_http_fetch_check.dart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test source outage handling and data validation
        run: node --test test/tooling/*.mjs
      - name: Test record preparation and state catalogs
        run: |
          python3 -m pip install lxml==6.1.1
          python3 -m unittest discover -s test/tooling -p 'test_*.py'
      - name: Import Iowa dated Scratch prize inventory
        run: python3 tooling/import_iowa_scratch_catalog.py data/iowa_scratch_catalog.generated.json
      - name: Import Indiana top-prize inventory
        run: python3 tooling/import_indiana_scratch_catalog.py data/indiana_scratch_catalog.generated.json
      - name: Import Kansas verified Scratch inventory
        run: python3 tooling/import_kansas_scratch_catalog.py data/kansas_scratch_catalog.generated.json
      - name: Import Nebraska catalog with dated reviewed inventory
        run: python3 tooling/import_nebraska_scratch_catalog.py data/nebraska_scratch_catalog.generated.json
      - name: Import South Dakota published active Scratch subset
        run: python3 tooling/import_south_dakota_scratch_catalog.py data/south_dakota_scratch_catalog.generated.json
      - name: Import New Mexico unexpired estimated top-prize inventory
        run: python3 tooling/import_new_mexico_scratch_catalog.py data/new_mexico_scratch_catalog.generated.json
      - name: Import Oklahoma verified Scratcher inventory
        run: python3 tooling/import_oklahoma_scratch_catalog.py data/oklahoma_scratch_catalog.generated.json
      - name: Import Louisiana verified detail inventory
        run: python3 tooling/import_louisiana_scratch_catalog.py data/louisiana_scratch_catalog.generated.json
      - name: Import Maryland dated Scratch-Off inventory
        run: python3 tooling/import_maryland_scratch_catalog.py data/maryland_scratch_catalog.generated.json
      - name: Import Connecticut detail-verified Scratch inventory
        run: python3 tooling/import_connecticut_scratch_catalog.py data/connecticut_scratch_catalog.generated.json
      - name: Import Maine dated top-tier catalog subset
        run: python3 tooling/import_maine_scratch_catalog.py data/maine_scratch_catalog.generated.json
      - name: Import Vermont verified unclaimed top-tier inventory
        run: python3 tooling/import_vermont_scratch_catalog.py data/vermont_scratch_catalog.generated.json
      - name: Import New Hampshire matched Scratch inventory
        run: python3 tooling/import_new_hampshire_scratch_catalog.py data/new_hampshire_scratch_catalog.generated.json
      - name: Import Delaware current top-prize inventory
        run: python3 tooling/import_delaware_scratch_catalog.py data/delaware_scratch_catalog.generated.json
      - name: Import Michigan listed retail instant inventory
        run: node tooling/import_michigan_scratch_catalog.mjs data/michigan_scratch_catalog.generated.json
      - name: Import Oregon published Scratch-it inventory
        run: node tooling/import_oregon_scratch_catalog.mjs data/oregon_scratch_catalog.generated.json
      - name: Import Wisconsin published Scratch catalog
        run: python3 tooling/import_wisconsin_scratch_catalog.py data/wisconsin_scratch_catalog.generated.json
      - name: Import Washington published Scratch inventories
        run: python3 tooling/import_washington_scratch_catalog.py data/washington_scratch_catalog.generated.json
      - name: Import current official North Carolina winner claims
        run: >-
          node tooling/import_north_carolina_current_winners.mjs
          data/north_carolina_current_winner_activity.generated.json
      - name: Import the complete current Kentucky Scratch-Off catalog
        run: >-
          node tooling/import_kentucky_scratch_catalog.mjs
          data/kentucky_scratch_catalog.generated.json
      - name: Import the current Minnesota Scratch Game catalog
        run: >-
          node tooling/import_minnesota_scratch_catalog.mjs
          data/minnesota_scratch_catalog.generated.json
      - name: Import the official Kentucky statewide retailer directory
        run: >-
          node tooling/import_kentucky_retailer_directory.mjs
          data/kentucky_retailer_directory.generated.json
          assets/maps/us_counties.geojson
      - name: Import current official Kentucky winner notices
        run: >-
          node tooling/import_kentucky_current_winners.mjs
          data/kentucky_current_winner_activity.generated.json
          data/kentucky_retailer_directory.generated.json
      - name: Import the complete current Virginia Scratcher catalog
        run: >-
          node tooling/import_virginia_scratch_catalog.mjs
          data/virginia_scratch_catalog.generated.json
      - name: Import the official Virginia statewide retailer directory
        run: >-
          node tooling/import_virginia_retailer_directory.mjs
          data/virginia_retailer_directory.generated.json
      - name: Import official Virginia physical winner releases
        run: >-
          node tooling/import_virginia_winners.mjs
          data/virginia_winner_activity.generated.json
          data/virginia_retailer_directory.generated.json
      - name: Import the complete current New York Scratch-Off catalog
        run: >-
          node tooling/import_new_york_scratch_catalog.mjs
          data/new_york_scratch_catalog.generated.json
      - name: Import the official New York statewide retailer directory
        run: >-
          node tooling/import_new_york_retailer_directory.mjs
          data/new_york_retailer_directory.generated.json
          assets/maps/us_counties.geojson
      - name: Import official New York physical winner activity
        run: >-
          node tooling/import_new_york_winners.mjs
          data/new_york_winner_activity.generated.json
          data/new_york_retailer_directory.generated.json
          data/new_york_scratch_catalog.generated.json
      - name: Import the complete current Ohio Scratch-Off catalog
        run: >-
          node tooling/import_ohio_scratch_catalog.mjs
          data/ohio_scratch_catalog.generated.json
      - name: Import the official Ohio statewide retailer directory
        run: >-
          node tooling/import_ohio_retailer_directory.mjs
          data/ohio_retailer_directory.generated.json
          assets/maps/us_counties.geojson
      - name: Import official Ohio physical winner activity
        run: >-
          node tooling/import_ohio_winners.mjs
          data/ohio_winner_activity.generated.json
          data/ohio_retailer_directory.generated.json
          data/ohio_scratch_catalog.generated.json
      - name: Import the complete current Colorado Scratch catalog
        run: >-
          node tooling/import_colorado_scratch_catalog.mjs
          data/colorado_scratch_catalog.generated.json
      - name: Import the official Colorado statewide retailer directory
        run: >-
          node tooling/import_colorado_retailer_directory.mjs
          data/colorado_retailer_directory.generated.json
          assets/maps/us_counties.geojson
      - name: Import official Colorado physical winner activity
        run: >-
          node tooling/import_colorado_winners.mjs
          data/colorado_winner_activity.generated.json
          data/colorado_retailer_directory.generated.json
      - name: Import the complete current Texas Scratch catalog
        run: >-
          node tooling/import_texas_scratch_catalog.mjs
          data/texas_scratch_catalog.generated.json
      - name: Import the official Texas statewide retailer directory
        run: >-
          node tooling/import_texas_retailer_directory.mjs
          data/texas_retailer_directory.generated.json
      - name: Import official Texas physical winner activity
        run: >-
          node tooling/import_texas_winners.mjs
          data/texas_scratch_catalog.generated.json
          data/texas_retailer_directory.generated.json
          data/texas_winner_activity.generated.json
      - name: Import the current official South Carolina Winners Report
        run: >-
          dart run tooling/import_south_carolina_winners_report.dart
          --output data/south_carolina_current_winner_activity.generated.json
      - name: Validate verified activity and build the public feed
        run: >-
          dart run tooling/publish_activity_feed.dart
          --sources tooling/approved_activity_sources.json
          --output docs/activity.json
      - name: Import Missouri Show Me Cash winning-ticket counts
        run: >-
          python3 tooling/import_missouri_show_me_cash_totals.py
          data/state_winning_ticket_totals.json
      - name: Stage Kentucky's live catalog and retailer feeds
        run: |
          node tooling/publish_state_totals.mjs data/state_winning_ticket_totals.json docs/state_winning_ticket_totals.json
          cp data/kentucky_scratch_catalog.generated.json docs/kentucky_scratch_catalog.json
          cp data/kentucky_retailer_directory.generated.json docs/kentucky_retailer_directory.json
          node tooling/build_state_data_feeds.mjs \
            docs/state_scratch_catalogs.json \
            docs/state_retailer_directories.json \
            data/kentucky_scratch_catalog.generated.json \
            data/minnesota_scratch_catalog.generated.json \
            data/washington_scratch_catalog.generated.json \
            data/wisconsin_scratch_catalog.generated.json \
            data/oregon_scratch_catalog.generated.json \
            data/michigan_scratch_catalog.generated.json \
            data/iowa_scratch_catalog.generated.json \
            data/indiana_scratch_catalog.generated.json \
            data/kansas_scratch_catalog.generated.json \
            data/nebraska_scratch_catalog.generated.json \
            data/south_dakota_scratch_catalog.generated.json \
            data/new_mexico_scratch_catalog.generated.json \
            data/oklahoma_scratch_catalog.generated.json \
            data/louisiana_scratch_catalog.generated.json \
            data/maryland_scratch_catalog.generated.json \
            data/connecticut_scratch_catalog.generated.json \
            data/maine_scratch_catalog.generated.json \
            data/vermont_scratch_catalog.generated.json \
            data/new_hampshire_scratch_catalog.generated.json \
            data/delaware_scratch_catalog.generated.json \
            data/kentucky_retailer_directory.generated.json \
            data/virginia_scratch_catalog.generated.json \
            data/virginia_retailer_directory.generated.json \
            data/new_york_scratch_catalog.generated.json \
            data/new_york_retailer_directory.generated.json \
            data/ohio_scratch_catalog.generated.json \
            data/ohio_retailer_directory.generated.json \
            data/colorado_scratch_catalog.generated.json \
            data/colorado_retailer_directory.generated.json \
            data/texas_scratch_catalog.generated.json \
            data/texas_retailer_directory.generated.json
      - name: Commit a changed feed
        run: |
          if [[ -z "$(git status --porcelain -- docs/activity.json docs/kentucky_scratch_catalog.json docs/kentucky_retailer_directory.json docs/state_scratch_catalogs.json docs/state_retailer_directories.json docs/state_winning_ticket_totals.json data/state_winning_ticket_totals.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json data/kentucky_historical_activity.generated.json data/kentucky_current_winner_activity.generated.json data/kentucky_scratch_catalog.generated.json data/kentucky_retailer_directory.generated.json data/virginia_scratch_catalog.generated.json data/virginia_retailer_directory.generated.json data/virginia_winner_activity.generated.json data/new_york_scratch_catalog.generated.json data/new_york_retailer_directory.generated.json data/new_york_winner_activity.generated.json data/ohio_scratch_catalog.generated.json data/ohio_retailer_directory.generated.json data/ohio_winner_activity.generated.json data/colorado_scratch_catalog.generated.json data/colorado_retailer_directory.generated.json data/colorado_winner_activity.generated.json data/texas_scratch_catalog.generated.json data/texas_retailer_directory.generated.json data/texas_winner_activity.generated.json data/minnesota_scratch_catalog.generated.json data/washington_scratch_catalog.generated.json data/wisconsin_scratch_catalog.generated.json data/oregon_scratch_catalog.generated.json data/michigan_scratch_catalog.generated.json data/iowa_scratch_catalog.generated.json data/indiana_scratch_catalog.generated.json data/kansas_scratch_catalog.generated.json data/nebraska_scratch_catalog.generated.json data/south_dakota_scratch_catalog.generated.json data/new_mexico_scratch_catalog.generated.json data/oklahoma_scratch_catalog.generated.json data/louisiana_scratch_catalog.generated.json data/maryland_scratch_catalog.generated.json data/connecticut_scratch_catalog.generated.json data/maine_scratch_catalog.generated.json data/vermont_scratch_catalog.generated.json data/new_hampshire_scratch_catalog.generated.json data/delaware_scratch_catalog.generated.json)" ]]; then
            echo "No verified activity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/activity.json docs/kentucky_scratch_catalog.json docs/kentucky_retailer_directory.json docs/state_scratch_catalogs.json docs/state_retailer_directories.json docs/state_winning_ticket_totals.json data/state_winning_ticket_totals.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json data/kentucky_historical_activity.generated.json data/kentucky_current_winner_activity.generated.json data/kentucky_scratch_catalog.generated.json data/kentucky_retailer_directory.generated.json data/virginia_scratch_catalog.generated.json data/virginia_retailer_directory.generated.json data/virginia_winner_activity.generated.json data/new_york_scratch_catalog.generated.json data/new_york_retailer_directory.generated.json data/new_york_winner_activity.generated.json data/ohio_scratch_catalog.generated.json data/ohio_retailer_directory.generated.json data/ohio_winner_activity.generated.json data/colorado_scratch_catalog.generated.json data/colorado_retailer_directory.generated.json data/colorado_winner_activity.generated.json data/texas_scratch_catalog.generated.json data/texas_retailer_directory.generated.json data/texas_winner_activity.generated.json data/minnesota_scratch_catalog.generated.json data/washington_scratch_catalog.generated.json data/wisconsin_scratch_catalog.generated.json data/oregon_scratch_catalog.generated.json data/michigan_scratch_catalog.generated.json data/iowa_scratch_catalog.generated.json data/indiana_scratch_catalog.generated.json data/kansas_scratch_catalog.generated.json data/nebraska_scratch_catalog.generated.json data/south_dakota_scratch_catalog.generated.json data/new_mexico_scratch_catalog.generated.json data/oklahoma_scratch_catalog.generated.json data/louisiana_scratch_catalog.generated.json data/maryland_scratch_catalog.generated.json data/connecticut_scratch_catalog.generated.json data/maine_scratch_catalog.generated.json data/vermont_scratch_catalog.generated.json data/new_hampshire_scratch_catalog.generated.json data/delaware_scratch_catalog.generated.json
          git commit -m "Publish verified lottery activity feed"
          # A human commit can land during the long source-import job.
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
