name: Validate and publish lottery activity

on:
  schedule:
    # Daily validation of approved official-source snapshots.
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'tooling/**'
      - '.github/workflows/publish-activity-feed.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lottery-atlas-activity-publish
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import current official North Carolina winner claims
        run: >-
          node tooling/import_north_carolina_current_winners.mjs
          data/north_carolina_current_winner_activity.generated.json
      - name: Import the current official South Carolina Winners Report
        run: >-
          dart run tooling/import_south_carolina_winners_report.dart
          --output data/south_carolina_current_winner_activity.generated.json
      - name: Validate verified activity and build the public feed
        run: >-
          dart run tooling/publish_activity_feed.dart
          --sources tooling/approved_activity_sources.json
          --output docs/activity.json
      - name: Commit a changed feed
        run: |
          if git diff --quiet -- docs/activity.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json; then
            echo "No verified activity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/activity.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json
          git commit -m "Publish verified lottery activity feed"
          git push

  deploy-pages:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import current official North Carolina winner claims
        run: >-
          node tooling/import_north_carolina_current_winners.mjs
          data/north_carolina_current_winner_activity.generated.json
      - name: Import the current official South Carolina Winners Report
        run: >-
          dart run tooling/import_south_carolina_winners_report.dart
          --output data/south_carolina_current_winner_activity.generated.json
      - name: Build the deployment artifact
        run: >-
          dart run tooling/publish_activity_feed.dart
          --sources tooling/approved_activity_sources.json
          --output docs/activity.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
