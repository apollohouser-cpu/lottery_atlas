name: Validate and publish lottery activity

on:
  schedule:
    # Recheck refreshable official sources every six hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tooling/**'
      - 'test/tooling/**'
      - '.github/workflows/publish-activity-feed.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lottery-atlas-activity-publish
  cancel-in-progress: false

jobs:
  validate-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued events can reference a commit from before the preceding
          # feed run pushed its generated files. Import from today's branch tip.
          ref: main
      - uses: dart-lang/setup-dart@v1
      - name: Test bounded source HTTP requests
        run: dart test/tooling/source_http_fetch_check.dart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test source outage handling and data validation
        run: node --test test/tooling/*.mjs
      - name: Test record preparation and state catalogs
        run: |
          python3 -m pip install lxml==6.1.1
          python3 -m unittest discover -s test/tooling -p 'test_*.py'
      - name: Refresh states independently and report retained data
        run: python3 tooling/refresh_states.py
      - name: Validate verified activity and build the public feed
        run: >-
          dart run tooling/publish_activity_feed.dart
          --sources tooling/approved_activity_sources.json
          --output docs/activity.json
      - name: Stage Kentucky's live catalog and retailer feeds
        run: |
          node tooling/publish_state_totals.mjs data/state_winning_ticket_totals.json docs/state_winning_ticket_totals.json
          cp data/kentucky_scratch_catalog.generated.json docs/kentucky_scratch_catalog.json
          cp data/kentucky_retailer_directory.generated.json docs/kentucky_retailer_directory.json
          node tooling/build_state_data_feeds.mjs \
            docs/state_scratch_catalogs.json \
            docs/state_retailer_directories.json \
            data/kentucky_scratch_catalog.generated.json \
            data/minnesota_scratch_catalog.generated.json \
            data/washington_scratch_catalog.generated.json \
            data/wisconsin_scratch_catalog.generated.json \
            data/oregon_scratch_catalog.generated.json \
            data/michigan_scratch_catalog.generated.json \
            data/iowa_scratch_catalog.generated.json \
            data/indiana_scratch_catalog.generated.json \
            data/kansas_scratch_catalog.generated.json \
            data/nebraska_scratch_catalog.generated.json \
            data/south_dakota_scratch_catalog.generated.json \
            data/new_mexico_scratch_catalog.generated.json \
            data/oklahoma_scratch_catalog.generated.json \
            data/louisiana_scratch_catalog.generated.json \
            data/maryland_scratch_catalog.generated.json \
            data/connecticut_scratch_catalog.generated.json \
            data/maine_scratch_catalog.generated.json \
            data/vermont_scratch_catalog.generated.json \
            data/new_hampshire_scratch_catalog.generated.json \
            data/delaware_scratch_catalog.generated.json \
            data/idaho_scratch_catalog.generated.json \
            data/kentucky_retailer_directory.generated.json \
            data/virginia_scratch_catalog.generated.json \
            data/virginia_retailer_directory.generated.json \
            data/new_york_scratch_catalog.generated.json \
            data/new_york_retailer_directory.generated.json \
            data/ohio_scratch_catalog.generated.json \
            data/ohio_retailer_directory.generated.json \
            data/colorado_scratch_catalog.generated.json \
            data/colorado_retailer_directory.generated.json \
            data/texas_scratch_catalog.generated.json \
            data/texas_retailer_directory.generated.json
      - name: Commit a changed feed
        run: |
          if [[ -z "$(git status --porcelain -- docs/state_refresh_status.json docs/state_refresh_status.html docs/activity.json docs/kentucky_scratch_catalog.json docs/kentucky_retailer_directory.json docs/state_scratch_catalogs.json docs/state_retailer_directories.json docs/state_winning_ticket_totals.json data/state_winning_ticket_totals.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json data/kentucky_historical_activity.generated.json data/kentucky_current_winner_activity.generated.json data/kentucky_scratch_catalog.generated.json data/kentucky_retailer_directory.generated.json data/virginia_scratch_catalog.generated.json data/virginia_retailer_directory.generated.json data/virginia_winner_activity.generated.json data/new_york_scratch_catalog.generated.json data/new_york_retailer_directory.generated.json data/new_york_winner_activity.generated.json data/ohio_scratch_catalog.generated.json data/ohio_retailer_directory.generated.json data/ohio_winner_activity.generated.json data/colorado_scratch_catalog.generated.json data/colorado_retailer_directory.generated.json data/colorado_winner_activity.generated.json data/texas_scratch_catalog.generated.json data/texas_retailer_directory.generated.json data/texas_winner_activity.generated.json data/texas_draw_activity.generated.json data/minnesota_scratch_catalog.generated.json data/washington_scratch_catalog.generated.json data/wisconsin_scratch_catalog.generated.json data/oregon_scratch_catalog.generated.json data/michigan_scratch_catalog.generated.json data/iowa_scratch_catalog.generated.json data/indiana_scratch_catalog.generated.json data/kansas_scratch_catalog.generated.json data/nebraska_scratch_catalog.generated.json data/south_dakota_scratch_catalog.generated.json data/new_mexico_scratch_catalog.generated.json data/oklahoma_scratch_catalog.generated.json data/louisiana_scratch_catalog.generated.json data/maryland_scratch_catalog.generated.json data/connecticut_scratch_catalog.generated.json data/maine_scratch_catalog.generated.json data/vermont_scratch_catalog.generated.json data/new_hampshire_scratch_catalog.generated.json data/delaware_scratch_catalog.generated.json data/idaho_scratch_catalog.generated.json)" ]]; then
            echo "No verified activity changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/state_refresh_status.json docs/state_refresh_status.html docs/activity.json docs/kentucky_scratch_catalog.json docs/kentucky_retailer_directory.json docs/state_scratch_catalogs.json docs/state_retailer_directories.json docs/state_winning_ticket_totals.json data/state_winning_ticket_totals.json data/south_carolina_current_winner_activity.generated.json data/north_carolina_current_winner_activity.generated.json data/kentucky_historical_activity.generated.json data/kentucky_current_winner_activity.generated.json data/kentucky_scratch_catalog.generated.json data/kentucky_retailer_directory.generated.json data/virginia_scratch_catalog.generated.json data/virginia_retailer_directory.generated.json data/virginia_winner_activity.generated.json data/new_york_scratch_catalog.generated.json data/new_york_retailer_directory.generated.json data/new_york_winner_activity.generated.json data/ohio_scratch_catalog.generated.json data/ohio_retailer_directory.generated.json data/ohio_winner_activity.generated.json data/colorado_scratch_catalog.generated.json data/colorado_retailer_directory.generated.json data/colorado_winner_activity.generated.json data/texas_scratch_catalog.generated.json data/texas_retailer_directory.generated.json data/texas_winner_activity.generated.json data/texas_draw_activity.generated.json data/minnesota_scratch_catalog.generated.json data/washington_scratch_catalog.generated.json data/wisconsin_scratch_catalog.generated.json data/oregon_scratch_catalog.generated.json data/michigan_scratch_catalog.generated.json data/iowa_scratch_catalog.generated.json data/indiana_scratch_catalog.generated.json data/kansas_scratch_catalog.generated.json data/nebraska_scratch_catalog.generated.json data/south_dakota_scratch_catalog.generated.json data/new_mexico_scratch_catalog.generated.json data/oklahoma_scratch_catalog.generated.json data/louisiana_scratch_catalog.generated.json data/maryland_scratch_catalog.generated.json data/connecticut_scratch_catalog.generated.json data/maine_scratch_catalog.generated.json data/vermont_scratch_catalog.generated.json data/new_hampshire_scratch_catalog.generated.json data/delaware_scratch_catalog.generated.json data/idaho_scratch_catalog.generated.json
          git commit -m "Publish verified lottery activity feed"
          # A human commit can land during the long source-import job.
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
